ight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2c9bc25a-499b-46e1-83fc-1c751fed1142\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"9e690961-4291-4a6d-b504-f1524c8c4797\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Special Gothic Expanded One';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fd0e5513-3d42-48af-bd27-dae6f95782cb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Special Gothic Expanded One';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8aa4ee44-0653-44f4-897d-419e83b38a30\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --font-sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n  /* Cover / divider display face — use ALL-CAPS only. */\n  --font-display: 'Special Gothic Expanded One', 'Instrument Sans', Arial, sans-serif;\n}\n\n/* ==========================================================================\n   COLORS — Samsara \"Project Owl\"\n   90/10 rule: neutrals dominate; Signal yellow is a spotlight, never a fill.\n   ========================================================================== */\n:root {\n  /* --- Neutrals (the 90%) --- */\n  --gray-100: #F5F4F1;   /* lightest surface, content-slide background */\n  --gray-300: #E0DDD5;   /* borders, dividers, subtle fills */\n  --gray-500: #B9B6AD;   /* muted text, disabled, captions */\n  --gray-700: #6B6862;   /* secondary text on light */\n  --black:    #1C1917;   /* primary ink, dark covers (a.k.a. Gray 950) */\n\n  /* --- Signal accent (the 10%) --- */\n  --signal:        #FEAE0F;  /* Signal yellow — CTAs, emphasis, highlights */\n  --signal-ink:    #1C1917;  /* text sitting on Signal yellow */\n  --signal-dim:    #C98A0C;  /* pressed / darker signal */\n\n  /* ACCESSIBILITY RULE — Signal is NEVER a text color on light surfaces.\n     #FEAE0F on Gray 100 is ~1.6:1 contrast; it fails WCAG badly.\n     - On LIGHT backgrounds: Signal may only be a FILL behind dark text\n       (use --signal-highlight + --text-on-signal), or a shape/rule/marker.\n     - On DARK backgrounds (Black 1000): Signal MAY be a text color\n       (~8.7:1) — use --signal-on-dark.\n     Emphasis on light slides = bold weight or a Signal highlight, not\n       Signal-colored type. */\n  --signal-highlight: var(--signal);   /* fill behind dark text on light slides */\n  --signal-on-dark:   var(--signal);   /* the ONLY approved Signal text color */\n\n  /* --- Pure --- */\n  --white: #FFFFFF;\n\n  /* --- Extended gray ramp — DATA VISUALIZATION ONLY ---\n     This full ramp (paired with Signal) is for charts/graphs ONLY.\n     Never use these anywhere else in a deck — body slides, cards, dividers,\n     text, and backgrounds use the core neutrals above, not this ramp. */\n  --dataviz-gray-200: #EAE8E3;  /* PMS Cool Gray 1 C */\n  --dataviz-gray-300: #E0DDD5;  /* PMS Cool Gray 2 C */\n  --dataviz-gray-400: #CCC9C1;  /* PMS Cool Gray 4 C */\n  --dataviz-gray-500: #B9B6AD;  /* PMS Cool Gray 5 C */\n  --dataviz-gray-600: #9C9890;  /* PMS Cool Gray 7 C */\n  --dataviz-gray-700: #716F67;  /* PMS Cool Gray 9 C */\n  --dataviz-gray-800: #403D37;  /* PMS Cool Gray 10 C */\n  --dataviz-gray-900: #221F1B;  /* PMS Cool Gray 11 C */\n  --dataviz-black:    #1C1917;  /* Black 2 C */\n\n  /* ---------- Semantic aliases ---------- */\n  /* Surfaces */\n  --surface-page:     var(--gray-100);   /* default light page */\n  --surface-card:     var(--white);\n  --surface-raised:   var(--white);\n  --surface-inverse:  var(--black);      /* dark covers / dividers */\n  --surface-sunken:   var(--gray-300);\n\n  /* Text */\n  --text-strong:   var(--black);\n  --text-body:     #33302B;\n  --text-muted:    var(--gray-700);\n  --text-faint:    var(--gray-500);\n  --text-inverse:  var(--gray-100);      /* on dark surfaces */\n  --text-on-signal: var(--signal-ink);\n  --text-emphasis-light: var(--black);   /* emphasis on light slides — never Signal */\n\n  /* Lines */\n  --border-subtle:  var(--gray-300);\n  --border-strong:  var(--black);\n  --border-inverse: rgba(245,244,241,0.18);\n\n  /* Accent */\n  --accent:        var(--signal);\n  --accent-press:  var(--signal-dim);\n  --focus-ring:    var(--signal);\n}\n\n/* ==========================================================================\n   TYPOGRAPHY — Instrument Sans everywhere.\n   All-caps for eyebrows/labels/section markers; sentence case for headlines & body.\n   Special Gothic Expanded One is COVER + DIVIDER only, always ALL-CAPS.\n   Values below are the real, in-use slide values — edit here to change globally.\n   ========================================================================== */\n:root {\n  --font-sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n  /* Cover / divider display face — Special Gothic Expanded One, ALL-CAPS only. */\n  --font-display: 'Special Gothic Expanded One', 'Instrument Sans', Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular: 400; /* @kind other */\n  --fw-medium:  500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:    700; /* @kind other */\n\n  /* ---------- Slide type scale (the authoritative deck values) ---------- */\n  --fs-cover-headline:   82px;  /* covers — display face, all-caps */\n  --fs-divider-headline: 96px;  /* dividers — display face, all-caps */\n  --fs-slide-headline:   50px;  /* ONE size for every content slide headline */\n  --fs-slide-subhead:    24px;  /* optional bridge line under the headline */\n  --fs-slide-body:       20px;  /* body / lede / bullet copy on content slides */\n  --fs-stat:             62px;  /* proof numbers — regular weight 400 */\n  --fs-quote:            46px;  /* customer quote */\n  --fs-card-title:       21px;  /* card grid title (17–22 by card count) */\n  --fs-card-body:        15px;  /* card grid body (14–16 by card count) */\n  --fs-eyebrow:          13px;  /* all-caps labels/section markers */\n  --fs-footer:           9px;   /* left-rail confidential mark — LOCKED: Instrument Sans, 400. 9px here == 5pt in Google Slides. Never deviate. */\n\n  /* ---------- General UI scale ---------- */\n  --fs-caption:   14px;\n  --fs-body-sm:   15px;\n  --fs-body:      17px;\n  --fs-body-lg:   20px;\n  --fs-h4:        24px;\n  --fs-h3:        32px;\n  --fs-h2:        44px;\n  --fs-h1:        50px;\n\n  /* Line heights */\n  --lh-tight:   1.02;   /* @kind other */\n  --lh-snug:    1.1;    /* @kind other */\n  --lh-headline:1.08;   /* @kind other */\n  --lh-normal:  1.5;    /* @kind other */\n  --lh-relaxed: 1.6;    /* @kind other */\n\n  /* Letter spacing */\n  --ls-eyebrow:  0.14em;  /* @kind other */\n  --ls-caps:     0.08em;  /* @kind other */\n  --ls-display: -0.03em;  /* @kind other */\n  --ls-head:    -0.02em;  /* @kind other */\n  --ls-normal:   0;       /* @kind other */\n\n  /* ---------- Locked slide anchors (1280×720) ----------\n     Two families only:\n     TEXT-LED (left-aligned): the FIRST element always sits at\n       --slide-eyebrow-y (64px). With an eyebrow, the eyebrow takes that slot\n       and the headline follows at --slide-headline-y (113px). With no eyebrow,\n       the HEADLINE itself takes the 64px slot — never leave the band empty.\n     ALL slide titles are LEFT-ALIGNED at --slide-anchor-x. There is no\n     centered-title family: card grids, charts, tables and org charts put\n     their headline in the same 64px top-left slot as every other slide,\n     and their content flows from the left anchor rightward. */\n  --slide-anchor-x:            128px;  /* left edge of the content column */\n  --slide-eyebrow-y:            64px;  /* first element, text-led slides */\n  --slide-headline-y:          113px;  /* headline, text-led slides (always) */\n  /* card-grid row top; clears a 2-line headline */\n  --slide-grid-top:            227px;  /* @kind spacing */\n  /* Headline measure — full-width slides. Grids, charts, tables and org\n     charts have NO right-hand media column at headline height (their\n     content starts at --slide-grid-top), so the title is free to span\n     the full content width and should set on ONE line wherever it can. */\n  --measure-headline-wide:      30ch;  /* @kind other */\n  --slide-media-x:             645px;  /* right-hand media / data column */\n\n  /* Locked vertical rhythm */\n  --gap-eyebrow-headline: 22px;\n  --gap-headline-subhead: 22px;\n  --gap-headline-body:    40px;\n\n  /* Headline measure — max 2 lines, ~50 characters */\n  --measure-headline: 15ch;\n  /* Split / side-panel layouts (data-viz): narrower measure so the headline\n     breaks to a new line early and keeps a full gutter to the white panel. */\n  --measure-headline-split: 11ch;\n\n  /* EXPORT WRAP SAFETY\n     PowerPoint/Google Slides measure text slightly wider than the browser\n     (they often ignore negative letter-spacing), so a line that just fits\n     here wraps there. Give every text box ~6% width headroom beyond the\n     longest manual line so the export has room. Never size a text box to\n     the exact pixel width of its text. */\n  --wrap-safety: 1.06; /* @kind other */\n}\n\n/* ==========================================================================\n   SPACING, RADII, SHADOWS, LAYOUT\n   Restrained. Sharp-ish corners; flat surfaces with hairline borders,\n   not heavy drop-shadows. Photography carries the drama, not chrome.\n   ========================================================================== */\n:root {\n  /* 4px base spacing scale */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10:128px;\n\n  /* Radii — modest, near-square */\n  --radius-none: 0px;\n  --radius-sm:   2px;\n  --radius-md:   4px;\n  --radius-lg:   8px;\n  --radius-pill: 999px;\n\n  /* Borders */\n  --border-width: 1px;\n  --border-width-strong: 2px;\n\n  /* Shadows — used sparingly, low and soft */\n  --shadow-none: none;\n  --shadow-sm:  0 1px 2px rgba(28,25,23,0.06);\n  --shadow-md:  0 4px 16px rgba(28,25,23,0.08);\n  --shadow-lg:  0 12px 40px rgba(28,25,23,0.12);\n\n  /* Focus */\n  --focus-width: 3px;\n\n  /* Layout */\n  --content-max: 1200px;\n  --gutter: var(--space-7);\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 220ms; /* @kind other */\n  --dur-slow: 400ms; /* @kind other */\n\n  /* Dark image scrim (protection gradient for text over photos) */\n  --scrim-cover: linear-gradient(180deg, rgba(28,25,23,0.15) 0%, rgba(28,25,23,0.55) 55%, rgba(28,25,23,0.85) 100%); /* @kind other */\n  --scrim-left:  linear-gradient(90deg, rgba(28,25,23,0.85) 0%, rgba(28,25,23,0.35) 45%, rgba(28,25,23,0) 70%); /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"00e85109-7e34-465f-9c53-2531c41f7bd0\"><\u002Fscript>\n  <style>\n    *{box-sizing:border-box;}\n    body{margin:0; font-family:var(--font-sans); background:var(--gray-100); color:var(--text-body);}\n    a{color:var(--black); text-decoration:none;}\n    a:hover{text-decoration:underline;}\n    [data-anim]{opacity:0; transform:translateY(18px);}\n    [data-anim][data-reveal=\"in\"]{opacity:1; transform:none;\n      transition:opacity 720ms var(--ease-out), transform 720ms var(--ease-out);}\n    @media (prefers-reduced-motion: reduce){\n      [data-anim]{opacity:1!important; transform:none!important; transition:none!important;}\n    }\n    @media print{\n      [data-no-print]{display:none!important;}\n      [data-anim]{opacity:1!important; transform:none!important;}\n      body{background:#fff;}\n      *,*::before,*::after{animation:none!important; transition:none!important;}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh; background:var(--gray-100);\">\n\n  <!-- STICKY NAV -->\n  <div data-no-print=\"true\" style=\"position:sticky; top:0; z-index:50; background:var(--black); border-bottom:1px solid rgba(245,244,241,0.12); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px clamp(20px,5vw,64px); flex-wrap:nowrap;\">\n    <div style=\"display:flex; align-items:center; gap:10px; flex:none;\">\n      <img src=\"a6e5f6e2-7950-47f3-854a-e25933b590b8\" alt=\"Samsara\" style=\"height:24px; width:auto; display:block;\">\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:16px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; justify-content:flex-end;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <span sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.style }}\">{{ item.label }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"SamsaraDesignSystem_a84610.Button\" variant=\"inverse\" size=\"sm\" sc-camel-on-click=\"{{ printPage }}\" style=\"{{ printBtnStyle }}\" hint-size=\"70px,32px\">Print<\u002Fx-import>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"position:relative; display:flex; align-items:flex-end; min-height:clamp(360px,42vw,460px); background-image:linear-gradient(90deg, rgba(28,25,23,0.94) 0%, rgba(28,25,23,0.78) 48%, rgba(28,25,23,0.42) 82%), linear-gradient(180deg, rgba(28,25,23,0.55) 0%, rgba(28,25,23,0.10) 40%, rgba(28,25,23,0.45) 100%), url(&quot;bbd572e4-9016-4b73-8150-20a3b1e67cc7&quot;); background-size:cover; background-position:center;\">\n    <div style=\"position:relative; z-index:1; padding:56px clamp(20px,5vw,64px) 40px; max-width:1200px;\">\n      <img src=\"e0f462ef-d4a1-4d16-be51-854534d01f0e\" alt=\"Samsara\" style=\"height:26px; width:auto; display:block;\">\n      <div style=\"margin-top:28px;\">\n        <x-import component-from-global-scope=\"SamsaraDesignSystem_a84610.Eyebrow\" hint-size=\"auto,26px\">Self-review · check-in<\u002Fx-import>\n      <\u002Fdiv>\n      <h1 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); letter-spacing:var(--ls-head); font-size:clamp(40px,5.2vw,56px); line-height:var(--lh-headline); color:var(--gray-100); margin:20px 0 8px;\">Pranav Shah<\u002Fh1>\n      <div style=\"font-size:var(--fs-body-lg); font-weight:var(--fw-regular); color:rgba(245,244,241,0.84); max-width:56ch; line-height:1.5;\">Technical Account Manager IV. Customer reliability, scalable TAM programs, and cross-functional impact.<\u002Fdiv>\n      <div style=\"display:flex; gap:36px; margin-top:26px; flex-wrap:wrap;\">\n        <div><div style=\"font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-500);\">Role<\u002Fdiv><div style=\"font-size:15px; font-weight:700; color:var(--gray-100); margin-top:2px;\">Technical Account Manager IV<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-500);\">Team<\u002Fdiv><div style=\"font-size:15px; font-weight:700; color:var(--gray-100); margin-top:2px;\">TAM<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-500);\">Period<\u002Fdiv><div style=\"font-size:15px; font-weight:700; color:var(--gray-100); margin-top:2px;\">FY27 Q3<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:28px;\">\n        <sc-for list=\"{{ portfolioAccounts }}\" as=\"acc\" hint-placeholder-count=\"8\">\n          <div title=\"{{ acc.name }}\" style=\"display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px; background:rgba(245,244,241,0.10); border:1px solid rgba(245,244,241,0.22);\">\n            <sc-if value=\"{{ acc.showCode }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"width:32px; height:26px; display:flex; align-items:center; justify-content:center; background:var(--gray-100); color:var(--black); font-size:10.5px; font-weight:700; letter-spacing:0.04em; flex:none;\">{{ acc.code }}<\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"font-size:12.5px; font-weight:600; color:var(--gray-100); white-space:nowrap;\">{{ acc.name }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FILTER BAR -->\n  <div data-no-print=\"true\" style=\"background:var(--gray-100); border-bottom:1px solid var(--border-subtle); padding:16px clamp(20px,5vw,64px); display:flex; align-items:center; gap:12px; flex-wrap:wrap;\">\n    <span style=\"font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); flex:none;\">Filter by account<\u002Fspan>\n    <sc-for list=\"{{ accountChips }}\" as=\"chip\" hint-placeholder-count=\"8\">\n      <span sc-camel-on-click=\"{{ chip.onClick }}\" style=\"{{ chip.style }}\">{{ chip.label }}<\u002Fspan>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ hasFilter }}\" hint-placeholder-val=\"{{ false }}\">\n      <span sc-camel-on-click=\"{{ clearFilters }}\" style=\"font-size:12.5px; font-weight:700; color:var(--black); cursor:pointer; padding:8px 6px; text-decoration:underline;\">Clear filters<\u002Fspan>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1200px; margin:0 auto; padding:0 clamp(20px,5vw,64px) 100px;\">\n\n    <!-- STATS -->\n    <section id=\"stats\" style=\"padding-top:56px;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:24px;\">FY27 Q3 snapshot<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(max(240px, min(100%, 30%)),1fr)); gap:36px 28px; align-items:start;\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div data-anim=\"1\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.wrapStyle }}\">\n            <x-import component-from-global-scope=\"SamsaraDesignSystem_a84610.StatCallout\" value=\"{{ s.num }}\" label=\"{{ s.label }}\" hint-size=\"100%,120px\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ACHIEVEMENTS -->\n    <section id=\"achievements\" style=\"padding-top:72px;\">\n      <div style=\"display:flex; align-items:baseline; gap:4px; margin-bottom:14px;\">\n        <span style=\"flex:none; width:30px; font-size:var(--fs-h3); font-weight:700; line-height:1.12; color:var(--gray-500); font-variant-numeric:tabular-nums;\">1<\u002Fspan>\n        <h2 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:var(--fs-h3); letter-spacing:var(--ls-head); line-height:1.12; color:var(--black); margin:0;\">Since my last check-in<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--fs-body); line-height:var(--lh-normal); color:var(--text-muted); max-width:68ch; margin:0 0 28px;\">I delivered measurable impact across customer reliability, technical health, commercial outcomes, and scalable TAM programs.<\u002Fp>\n\n      <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:28px;\" data-no-print=\"true\">\n        <span style=\"font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted);\">Filter by focus area<\u002Fspan>\n        <sc-for list=\"{{ categoryChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <span sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(max(320px, min(100%, 48%)),1fr)); gap:20px; align-items:start;\">\n        <sc-for list=\"{{ achievements }}\" as=\"a\" hint-placeholder-count=\"7\">\n          <div data-anim=\"1\" style=\"{{ a.cardStyle }}\">\n            <span style=\"{{ a.badgeStyle }}\">{{ a.badge }}<\u002Fspan>\n            <h3 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:18px; line-height:1.3; letter-spacing:var(--ls-head); color:var(--black); margin:0 0 10px;\">{{ a.title }}<\u002Fh3>\n\n            <sc-if value=\"{{ a.isParagraph }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"{{ a.clampStyle }}\">{{ a.text }}<\u002Fp>\n              <span sc-camel-on-click=\"{{ a.onToggle }}\" style=\"display:inline-block; margin-top:10px; font-size:13px; font-weight:700; color:var(--black); cursor:pointer; text-decoration:underline;\">{{ a.toggleLabel }}<\u002Fspan>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ a.isList }}\" hint-placeholder-val=\"{{ false }}\">\n              <ul style=\"list-style:none; margin:12px 0 0; padding:0;\">\n                <sc-for list=\"{{ a.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <li style=\"display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--text-muted); padding:5px 0; line-height:1.55;\">\n                    <span style=\"flex:none; width:6px; height:6px; margin-top:8px; background:var(--black);\"><\u002Fspan>\n                    <span><b style=\"color:var(--black); font-variant-numeric:tabular-nums;\">{{ it.metric }}<\u002Fb> {{ it.text }}<\u002Fspan>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- VOICE OF CUSTOMER -->\n    <section id=\"voc\" style=\"padding-top:72px;\">\n      <div style=\"display:flex; align-items:baseline; gap:4px; margin-bottom:14px;\">\n        <span style=\"flex:none; width:30px; font-size:var(--fs-h3); font-weight:700; line-height:1.12; color:var(--gray-500); font-variant-numeric:tabular-nums;\">2<\u002Fspan>\n        <h2 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:var(--fs-h3); letter-spacing:var(--ls-head); line-height:1.12; color:var(--black); margin:0;\">Voice of the customer<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--fs-body); line-height:var(--lh-normal); color:var(--text-muted); max-width:68ch; margin:0 0 28px;\">Selected feedback from the latest TAM survey across my portfolio.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(max(320px, min(100%, 48%)),1fr)); gap:18px; align-items:start;\">\n        <sc-for list=\"{{ quotes }}\" as=\"q\" hint-placeholder-count=\"6\">\n          <div data-anim=\"1\" style=\"{{ q.cardStyle }}\">\n            <img src=\"a1e4e82c-0e21-4c17-8d9b-455d27e2a816\" alt=\"\" style=\"width:18px; height:18px; opacity:0.35; margin-bottom:12px;\">\n            <p style=\"font-size:16px; line-height:1.6; color:var(--text-body); margin:0 0 16px;\">{{ q.text }}<\u002Fp>\n            <div style=\"font-size:13px; font-weight:700; color:var(--black);\">{{ q.who }}<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--text-muted);\">{{ q.org }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- SENTIMENT -->\n    <section id=\"sentiment\" style=\"padding-top:72px;\">\n      <div style=\"display:flex; align-items:baseline; gap:4px; margin-bottom:14px;\">\n        <span style=\"flex:none; width:30px; font-size:var(--fs-h3); font-weight:700; line-height:1.12; color:var(--gray-500); font-variant-numeric:tabular-nums;\">3<\u002Fspan>\n        <h2 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:var(--fs-h3); letter-spacing:var(--ls-head); line-height:1.12; color:var(--black); margin:0;\">Account sentiment context<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--fs-body); line-height:var(--lh-normal); color:var(--text-muted); max-width:68ch; margin:0 0 28px;\">Reading sentiment as a trajectory, distinguishing account-level recovery from individual survey responses.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(max(320px, min(100%, 48%)),1fr)); gap:18px; align-items:start;\">\n        <div data-anim=\"1\" style=\"{{ unfiCardStyle }}\">\n          <span style=\"display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border-radius:var(--radius-sm); margin-bottom:12px; background:rgba(47,107,79,0.12); color:#215940;\">UNFI · Upgraded to Green<\u002Fspan>\n          <h3 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:18px; line-height:1.3; letter-spacing:var(--ls-head); color:var(--black); margin:0 0 8px;\">UNFI<\u002Fh3>\n          <p style=\"font-size:15px; color:var(--text-muted); margin:0; line-height:1.6;\">Account sentiment was formally upgraded from Yellow to Green after the team confirmed the account was on track with no major blockers. Individual survey responses still show Yellow, so I distinguish account-level recovery from respondent-level feedback. My focus is maintaining the Green trajectory by closing remaining priority items.<\u002Fp>\n        <\u002Fdiv>\n        <div data-anim=\"1\" style=\"{{ pfgCardStyle }}\">\n          <span style=\"display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border-radius:var(--radius-sm); margin-bottom:12px; background:rgba(154,91,18,0.14); color:#7A4A12;\">PFG · Watch<\u002Fspan>\n          <h3 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:18px; line-height:1.3; letter-spacing:var(--ls-head); color:var(--black); margin:0 0 8px;\">Performance Food Group<\u002Fh3>\n          <p style=\"font-size:15px; color:var(--text-muted); margin:0; line-height:1.6;\">The hotspot escalation shows active cross-functional work and a major customer update, while survey feedback is positive on technical expertise but asks for more proactive follow-through. My focus is moving PFG from technical progress toward stronger overall confidence.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- NEXT QUARTER -->\n    <section id=\"next\" style=\"padding-top:72px;\">\n      <div style=\"display:flex; align-items:baseline; gap:4px; margin-bottom:14px;\">\n        <span style=\"flex:none; width:30px; font-size:var(--fs-h3); font-weight:700; line-height:1.12; color:var(--gray-500); font-variant-numeric:tabular-nums;\">4<\u002Fspan>\n        <h2 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:var(--fs-h3); letter-spacing:var(--ls-head); line-height:1.12; color:var(--black); margin:0;\">What I will achieve in the quarter ahead<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--fs-body); line-height:var(--lh-normal); color:var(--text-muted); max-width:68ch; margin:0 0 28px;\">Converting current work into durable customer and team outcomes while keeping commitments realistic.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:14px;\">\n        <sc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div data-anim=\"1\" style=\"display:flex; gap:18px; background:var(--white); border:1px solid var(--border-subtle); padding:20px 22px;\">\n            <div style=\"flex:none; width:32px; height:32px; background:var(--black); color:var(--gray-100); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;\">{{ g.n }}<\u002Fdiv>\n            <div>\n              <h4 style=\"margin:0 0 5px; font-size:17px; font-weight:700; letter-spacing:var(--ls-head); color:var(--black);\">{{ g.title }}<\u002Fh4>\n              <p style=\"margin:0; font-size:15px; color:var(--text-muted); line-height:1.6;\">{{ g.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.6; color:var(--text-muted); margin-top:20px; max-width:68ch;\">This approach aligns with the Operating Principles by working with urgency, working backwards from measurable outcomes, using data honestly, keeping a high bar, and solving problems together.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- OPERATING PRINCIPLES -->\n    <section id=\"principles\" style=\"padding-top:72px; padding-bottom:16px;\">\n      <div style=\"display:flex; align-items:baseline; gap:4px; margin-bottom:24px;\">\n        <span style=\"flex:none; width:30px; font-size:var(--fs-h3); font-weight:700; line-height:1.12; color:var(--gray-500); font-variant-numeric:tabular-nums;\">5<\u002Fspan>\n        <h2 style=\"font-family:var(--font-sans); font-weight:var(--fw-bold); font-size:var(--fs-h3); letter-spacing:var(--ls-head); line-height:1.12; color:var(--black); margin:0;\">Operating Principles in action<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(max(320px, min(100%, 48%)),1fr)); gap:24px 32px; align-items:start;\">\n        <div data-anim=\"1\" style=\"border-top:1px solid var(--border-strong); padding-top:16px; display:flex; gap:14px;\">\n          <img src=\"0d6350f8-7d81-49b3-a9d9-a8dcf3946cc5\" alt=\"\" style=\"width:26px; height:26px; flex:none; margin-top:2px;\">\n          <div>\n            <h4 style=\"margin:0 0 5px; font-size:16px; font-weight:700; letter-spacing:var(--ls-head); color:var(--black);\">Work with urgency, deliver iteratively<\u002Fh4>\n            <p style=\"margin:0; font-size:15px; color:var(--text-muted); line-height:1.6;\">Drove critical PFG, NexTier, and BrandSafway issues to resolution, including a three-day Cassens HOS outage fix ahead of renewal.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"1\" style=\"border-top:1px solid var(--border-strong); padding-top:16px; display:flex; gap:14px;\">\n          <img src=\"fb506f3a-e840-4039-8b01-b57d7a742010\" alt=\"\" style=\"width:26px; height:26px; flex:none; margin-top:2px;\">\n          <div>\n            <h4 style=\"margin:0 0 5px; font-size:16px; font-weight:700; letter-spacing:var(--ls-head); color:var(--black);\">Keep a high bar<\u002Fh4>\n            <p style=\"margin:0; font-size:15px; color:var(--text-muted); line-height:1.6;\">Pursued root causes instead of workarounds, from the five-year PFG disconnection to recurring device-health faults.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"1\" style=\"border-top:1px solid var(--border-strong); padding-top:16px; display:flex; gap:14px;\">\n          <img src=\"f9df1d64-bfc8-4e11-afaa-2ae55739006f\" alt=\"\" style=\"width:26px; height:26px; flex:none; margin-top:2px;\">\n          <div>\n            <h4 style=\"margin:0 0 5px; font-size:16px; font-weight:700; letter-spacing:var(--ls-head); color:var(--black);\">Solve problems together<\u002Fh4>\n            <p style=\"margin:0; font-size:15px; color:var(--text-muted); line-height:1.6;\">Coordinated Support, Product, Engineering, PSE, Legal, and account teams to reach durable outcomes.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"1\" style=\"border-top:1px solid var(--border-strong); padding-top:16px; display:flex; gap:14px;\">\n          <img src=\"e8822312-c267-40aa-85d5-3a0f3686aeef\" alt=\"\" style=\"width:26px; height:26px; flex:none; margin-top:2px;\">\n          <div>\n            <h4 style=\"margin:0 0 5px; font-size:16px; font-weight:700; letter-spacing:var(--ls-head); color:var(--black);\">Work backwards from winning<\u002Fh4>\n            <p style=\"margin:0; font-size:15px; color:var(--text-muted); line-height:1.6;\">Turned one-off escalations into repeatable programs like THR and the Gateway Deactivation Tool.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FOOTER -->\n    <div style=\"margin-top:64px; padding-top:24px; border-top:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;\">\n      <div style=\"display:flex; align-items:center; gap:10px;\">\n        <img src=\"fa5d69ef-3e41-41d5-acb2-45aa20d52a74\" alt=\"\" style=\"width:18px; height:18px;\">\n        <span style=\"font-size:13px; color:var(--text-muted);\">© Samsara Inc. Confidential<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:13px; color:var(--text-muted);\">Pranav Shah · TAM IV · FY27 Q3<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { account: null, category: null, expanded: {}, active: 'stats' };\n\n  ACCOUNTS = ['UNFI','Performance Food Group','Cassens Transport','BrandSafway','APi Group','NexTier','DOT Transportation','TurnPoint Services'];\n\n  ACCOUNT_CODES = {\n    'UNFI': 'UNFI',\n    'Performance Food Group': 'PFG',\n    'Cassens Transport': 'CASS',\n    'BrandSafway': 'BSW',\n    'APi Group': 'APi',\n    'NexTier': 'NEX',\n    'DOT Transportation': 'DOT',\n    'TurnPoint Services': 'TPS',\n  };\n\n  CATEGORIES = [\n    { id: 'impact', label: 'Impact' },\n    { id: 'escalation', label: 'Escalation' },\n    { id: 'technical', label: 'Technical' },\n  ];\n\n  STATS = [\n    { id: 'outcomes', num: '49', label: 'TAM outcomes logged across 13 accounts', account: null },\n    { id: 'cassens', num: '97.3%', label: 'Cassens fleet health; 4 terminals at 100%', account: 'Cassens Transport' },\n    { id: 'dot', num: '95.7%', label: 'DOT fleet health, 95% target met', account: 'DOT Transportation' },\n    { id: 'osat', num: '4.82', label: 'Avg OSAT across 11 survey responses', account: null },\n    { id: 'upsell', num: '$340K', label: 'UNFI upsell motion supported', account: 'UNFI' },\n    { id: 'thr', num: '8+', label: 'Technical Health Reviews across accounts & TAMs', account: null },\n  ];\n\n  ACHIEVEMENTS = [\n    { id: 'pfg', category: 'impact', full: true, badge: 'Reliability · 5-year issue resolved', title: 'Resolved a five-year PFG Driver App issue', type: 'paragraph',\n      text: \"PFG had recurring Driver App disconnections when VG hotspots reached the 500 MB monthly data cap, frustrating the customer and blocking ELD rollout across operating companies. I led the investigation with Support and Product, identified the Android connectivity behavior behind the issue, and helped drive the VG39 firmware fix and data pooling solution. Early feedback showed fewer disconnects, restoring customer confidence and creating a path to resume ELD readiness work.\",\n      accounts: ['Performance Food Group'] },\n    { id: 'health', category: 'technical', full: false, badge: 'Technical health', title: 'Improved customer health across the portfolio', type: 'list',\n      items: [\n        { metric: '97.3%', text: 'Cassens fleet health; AG target met, four terminals at 100%, June closed with zero RMA cases' },\n        { metric: '95.7%', text: 'DOT fleet health by segmenting warehouse handhelds and issuing depot-level action lists' },\n        { metric: '93.5%', text: 'APi path from 90.6% across 15,121 devices and 33 operating companies' },\n        { metric: '85.4%', text: 'UNFI Asset Gateway health after deactivating 246 archived gateways' },\n      ],\n      accounts: ['Cassens Transport', 'DOT Transportation', 'APi Group', 'UNFI'] },\n    { id: 'thr', category: 'technical', full: false, badge: 'Scalable TAM programs', title: 'Scaled repeatable TAM solutions', type: 'list',\n      items: [\n        { metric: 'THR', text: 'productized into a reusable executive deck and workbook, now used across accounts and TAMs' },\n        { metric: '50-62%', text: 'integration error rates surfaced across Petit Forestier, PaqueteXpress, and Chick-fil-A' },\n        { metric: 'Org-wide', text: 'Gateway Deactivation Tool released across Cassens, APi, and NexTier' },\n      ],\n      accounts: ['Cassens Transport', 'APi Group', 'NexTier'] },\n    { id: 'brandsafway', category: 'escalation', full: true, badge: 'Strategic ownership · Legal escalation', title: 'BrandSafway legal and telematics license escalation', type: 'paragraph',\n      text: \"BrandSafway needed vehicle on-time data through the API while operating under safety-only licensing. I clarified the available endpoints and licensing boundaries, proposed trip history as a workable alternative, and coordinated with Legal, Product, Support, and the account team. The legal-to-legal discussion went well, with both sides aligned on avoiding a contractual dispute and finding a technical or commercial path. I also identified the feature-flag mechanism needed to clear vehicles stranded as regulated after the telematics trial expired. In parallel, I built a device health program from scratch that moved health to 83.6% and removed roughly 17,000 safety events of queue noise through automated dismissal, moving a Red account toward a documented path forward.\",\n      accounts: ['BrandSafway'] },\n    { id: 'nextier', category: 'escalation', full: false, badge: 'Escalation leadership', title: 'Protected safety-critical operations at NexTier', type: 'list',\n      items: [\n        { metric: '134', text: 'proactive camera RMAs and 63 Power Bridge shipments within five weeks' },\n        { metric: '4 days', text: 'to root cause on a P1 camera failure during an on-site executive visit' },\n        { metric: '8,834', text: 'devices baselined across 95 operating companies with a targeted remediation roadmap' },\n      ],\n      accounts: ['NexTier'] },\n    { id: 'commercial', category: 'impact', full: false, badge: 'Commercial impact', title: 'Supported commercial outcomes', type: 'paragraph',\n      text: \"I continued supporting the UNFI expansion motion, including the $340K upsell, and converted a Cassens hardware-loss observation into a qualified AT11/AT12 tracker opportunity handed to the account team with a stated buy signal. This connected technical discovery directly to expansion and retention.\",\n      accounts: ['UNFI', 'Cassens Transport'] },\n    { id: 'india-l1', category: 'technical', full: true, badge: 'Team & org enablement', title: 'Enabled the India-based L1 support team', type: 'paragraph',\n      text: \"I served as an ambassador for the TAM program in India, presenting a comprehensive overview for L1, L2, PSEs, and our newest support leaders to socialize our charter, strategic customer engagement model, and the technical value TAMs deliver. This strengthens the global operating model and tightens TAM and L1 partnership across regions.\",\n      accounts: [] },\n    { id: 'feedback', category: 'technical', full: true, badge: 'Voice of customer', title: 'Earned strong customer feedback', type: 'paragraph',\n      text: \"The latest TAM survey included 11 completed responses, averaging 4.82/5 for overall satisfaction, 4.73/5 for TAM actions, and 4.82/5 for TAM guidance. Customers described me as reliable, responsive, technically strong, and effective at helping them use Samsara more independently. My development focus is more proactive updates and tighter follow-through on long-running workstreams.\",\n      accounts: [] },\n  ];\n\n  QUOTES = [\n    { id: 'paluch', account: 'Cassens Transport', who: 'Ken Paluch', org: 'Cassens Transport Company', text: \"He's been a game changer for us. At first it was just he and I and now we often have dozens of participants on these calls. He sets goals, follows up on our action items, and has anticipated our needs many times.\" },\n    { id: 'hopper', account: 'Performance Food Group', who: 'William Hopper', org: 'Performance Food Group', text: \"Pranav has grown with us this year in a way that improved our ability to improve our program management. Very responsive, strong technical expertise, and shows the ability to adapt to fit the customer.\" },\n    { id: 'lawson', account: null, who: 'Will Lawson', org: 'J. Fletcher Creamer & Son', text: \"Pranav is very attentive to detail and communicates everything effectively. He goes above and beyond for any issues that I have and trains me on how to work the issues that I experience.\" },\n    { id: 'griffin', account: 'TurnPoint Services', who: 'Susan Griffin', org: 'TurnPoint Services', text: \"Pranav is easy to work with. He goes above and beyond to develop reports to help us and is eager to help us utilize all the tools available to better serve our organization.\" },\n    { id: 'wolf', account: 'UNFI', who: 'David Wolf', org: 'UNFI', text: \"Pranav does a great job for us. We have zero complaints. He works very hard for us to make up for the somewhat unreliable support we get when we open tickets.\" },\n    { id: 'hertzog', account: 'Performance Food Group', who: 'Bill Hertzog', org: 'Performance Food Group', text: \"Tech knowledge, speed of response, and will get an answer to a question that he might not have the answer to. Very attentive and responsive to questions and support needed.\" },\n  ];\n\n  GOALS = [\n    { id: 'health', n: '1', title: 'Account health and sentiment', text: \"Stabilize the PFG Driver App and ELD rollout, maintain UNFI's Green trajectory by closing priority items, and advance a clear technical and commercial path for BrandSafway's telematics and API needs. Measured through clear ownership, timely updates, and fewer repeat escalations.\" },\n    { id: 'scale', n: '2', title: 'Scale what works', text: \"Continue expanding Technical Health Reviews and the Gateway Deactivation Tool across priority accounts, prioritizing adoption, quality, and reusable documentation over a large number of new deliverables.\" },\n    { id: 'ai', n: '3', title: 'Use AI for leverage', text: \"Use AI, with human review and appropriate data handling, to accelerate THR summaries, meeting recaps, account-risk themes, and follow-up tracking, reducing manual preparation and improving consistency.\" },\n    { id: 'idp', n: '4', title: 'Continue my IDP development', text: \"Build deeper Camera, Safety, and API expertise; improve data storytelling and executive stakeholder influence; formalize successful work into playbooks; progress toward AWS and AI certification goals as capacity allows; and keep mentoring newer TAMs.\" },\n    { id: 'adjust', n: '5', title: 'Adjustments and support', text: \"Use a simple follow-up cadence with owners, dates, and status updates for long-running workstreams. Protect focused time for program work, and ask my manager to help prioritize the highest-impact account bets, secure cross-functional support for PFG and BrandSafway, and provide feedback on executive-level communication.\" },\n  ];\n\n  PRINCIPLES = [\n    { icon: 'assets/icons/op-urgency.svg', title: 'Work with urgency, deliver iteratively', text: 'Drove critical PFG, NexTier, and BrandSafway issues to resolution, including a three-day Cassens HOS outage fix ahead of renewal.' },\n    { icon: 'assets/icons/op-highbar.svg', title: 'Keep a high bar', text: 'Pursued root causes instead of workarounds, from the five-year PFG disconnection to recurring device-health faults.' },\n    { icon: 'assets/icons/op-together.svg', title: 'Solve problems together', text: 'Coordinated Support, Product, Engineering, PSE, Legal, and account teams to reach durable outcomes.' },\n    { icon: 'assets/icons/op-backwards.svg', title: 'Work backwards from winning', text: 'Turned one-off escalations into repeatable programs like THR and the Gateway Deactivation Tool.' },\n  ];\n\n  CAT_COLORS = {\n    impact: { bg: 'rgba(47,107,79,0.12)', fg: '#215940' },\n    escalation: { bg: 'rgba(154,91,18,0.14)', fg: '#7A4A12' },\n    technical: { bg: 'var(--gray-300)', fg: 'var(--black)' },\n  };\n\n  componentDidMount() {\n    this._sections = ['stats', 'achievements', 'voc', 'sentiment', 'next', 'principles'];\n    this._observer = new IntersectionObserver((entries) => {\n      entries.forEach((e) => { if (e.isIntersecting) this.setState({ active: e.target.id }); });\n    }, { rootMargin: '-35% 0px -55% 0px', threshold: 0 });\n    this._sections.forEach((id) => {\n      const el = document.getElementById(id);\n      if (el) this._observer.observe(el);\n    });\n    this._startReveal();\n  }\n\n  _startReveal() {\n    if (this._revealObserver) this._revealObserver.disconnect();\n    this._revealObserver = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        const group = el.parentElement ? Array.prototype.indexOf.call(el.parentElement.children, el) : 0;\n        el.style.transitionDelay = (group % 4) * 110 + 'ms';\n        el.setAttribute('data-reveal', 'in');\n        this._revealObserver.unobserve(el);\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n    this._sweepReveal();\n  }\n\n  _sweepReveal() {\n    if (!this._revealObserver) return;\n    document.querySelectorAll('[data-anim]:not([data-reveal])').forEach((el) => this._revealObserver.observe(el));\n  }\n\n  componentDidUpdate() {\n    if (this._sweepTimer) clearTimeout(this._sweepTimer);\n    this._sweepTimer = setTimeout(() => this._sweepReveal(), 60);\n  }\n\n  componentWillUnmount() {\n    if (this._observer) this._observer.disconnect();\n    if (this._revealObserver) this._revealObserver.disconnect();\n    if (this._sweepTimer) clearTimeout(this._sweepTimer);\n  }\n\n  setAccount(a) { this.setState((s) => ({ account: s.account === a ? null : a })); }\n  setCategory(c) { this.setState((s) => ({ category: s.category === c ? null : c })); }\n  clearFilters() { this.setState({ account: null, category: null }); }\n  toggleExpand(id) { this.setState((s) => ({ expanded: { ...s.expanded, [id]: !s.expanded[id] } })); }\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const y = el.getBoundingClientRect().top + window.scrollY - 84;\n    window.scrollTo({ top: y, behavior: 'smooth' });\n  }\n\n  dimStyle(dimmed) {\n    return { opacity: dimmed ? 0.3 : 1, filter: dimmed ? 'grayscale(65%)' : 'none', transition: 'opacity 220ms ease, filter 220ms ease' };\n  }\n\n  chipStyle(active) {\n    return {\n      display: 'inline-flex', alignItems: 'center', fontSize: '13px', fontWeight: 600,\n      padding: '7px 14px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', whiteSpace: 'nowrap',\n      transition: 'background 160ms ease, color 160ms ease, border-color 160ms ease',\n      background: active ? 'var(--black)' : 'var(--white)',\n      color: active ? 'var(--gray-100)' : 'var(--text-body)',\n      border: active ? '1px solid var(--black)' : '1px solid var(--border-subtle)',\n    };\n  }\n\n  cardBaseStyle(dimmed, full) {\n    return {\n      background: 'var(--white)', border: '1px solid var(--border-subtle)', padding: '24px 26px',\n      gridColumn: full ? '1 / -1' : 'auto',\n      ...this.dimStyle(dimmed),\n    };\n  }\n\n  renderVals() {\n    const { account, category, expanded, active } = this.state;\n\n    const achievements = this.ACHIEVEMENTS.map((a) => {\n      const accDim = !!account && a.accounts.length > 0 && a.accounts.indexOf(account) === -1;\n      const catDim = !!category && a.category !== category;\n      const dimmed = accDim || catDim;\n      const cc = this.CAT_COLORS[a.category];\n      return {\n        ...a,\n        isParagraph: a.type === 'paragraph',\n        isList: a.type === 'list',\n        cardStyle: this.cardBaseStyle(dimmed, a.full),\n        badgeStyle: { display: 'inline-block', fontSize: '11px', fontWeight: 700, letterSpacing: '0.06em', textTransform: 'uppercase', padding: '4px 10px', borderRadius: 'var(--radius-sm)', marginBottom: '12px', background: cc.bg, color: cc.fg },\n        expanded: !!expanded[a.id],\n        clampStyle: expanded[a.id]\n          ? { fontSize: '15px', color: 'var(--text-muted)', lineHeight: 1.6, margin: 0 }\n          : { fontSize: '15px', color: 'var(--text-muted)', lineHeight: 1.6, margin: 0, display: '-webkit-box', WebkitLineClamp: '3', WebkitBoxOrient: 'vertical', overflow: 'hidden' },\n        toggleLabel: expanded[a.id] ? 'Show less' : 'Read more',\n        onToggle: () => this.toggleExpand(a.id),\n      };\n    });\n\n    const quotes = this.QUOTES.map((q) => ({\n      ...q,\n      cardStyle: { background: 'var(--white)', border: '1px solid var(--border-subtle)', padding: '22px 24px', ...this.dimStyle(!!account && !!q.account && q.account !== account) },\n    }));\n\n    const stats = this.STATS.map((s) => ({\n      ...s,\n      wrapStyle: { cursor: s.account ? 'pointer' : 'default', ...this.dimStyle(!!account && !!s.account && s.account !== account) },\n      onClick: () => { if (s.account) this.setAccount(s.account); },\n    }));\n\n    const accountChips = this.ACCOUNTS.map((a) => ({ id: a, label: a, style: this.chipStyle(account === a), onClick: () => this.setAccount(a) }));\n    const categoryChips = this.CATEGORIES.map((c) => ({ ...c, style: this.chipStyle(category === c.id), onClick: () => this.setCategory(c.id) }));\n\n    const navDefs = [\n      { id: 'stats', label: 'Overview' },\n      { id: 'achievements', label: 'Achievements' },\n      { id: 'voc', label: 'Customers' },\n      { id: 'sentiment', label: 'Sentiment' },\n      { id: 'next', label: 'Next' },\n      { id: 'principles', label: 'Principles' },\n    ];\n    const navItems = navDefs.map((n) => ({\n      ...n,\n      onClick: () => this.scrollTo(n.id),\n      style: { fontSize: '13.5px', fontWeight: 600, cursor: 'pointer', padding: '4px 2px', whiteSpace: 'nowrap', color: active === n.id ? 'var(--gray-100)' : 'var(--gray-500)', borderBottom: active === n.id ? '2px solid var(--signal)' : '2px solid transparent', transition: 'color 160ms ease, border-color 160ms ease' },\n    }));\n\n    return {\n      navItems,\n      accountChips,\n      categoryChips,\n      achievements,\n      quotes,\n      stats,\n      goals: this.GOALS,\n      principles: this.PRINCIPLES,\n      portfolioAccounts: this.ACCOUNTS.map((a) => {\n        const code = this.ACCOUNT_CODES[a];\n        return { name: a, code, showCode: code !== a };\n      }),\n      hasFilter: !!(account || category),\n      clearFilters: () => this.clearFilters(),\n      printPage: () => window.print(),\n      printBtnStyle: { flex: 'none' },\n\n      unfiCardStyle: { background: 'var(--white)', border: '1px solid var(--border-subtle)', padding: '24px 26px', ...this.dimStyle(!!account && account !== 'UNFI') },\n      pfgCardStyle: { background: 'var(--white)', border: '1px solid var(--border-subtle)', padding: '24px 26px', ...this.dimStyle(!!account && account !== 'Performance Food Group') },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
